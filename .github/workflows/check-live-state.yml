name: Check Live Container State (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/plane_deploy_key
          chmod 600 ~/.ssh/plane_deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live container and image tags (read-only)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "
            echo '--- plane_live_1 status ---'; docker ps -a --filter name=plane_live_1 --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            echo '--- plane_live_1 current env API_BASE_URL (running container, pre-recreate) ---'; docker exec plane_live_1 printenv API_BASE_URL 2>&1 || echo 'FAILED (container down?)'
            echo '--- APP_RELEASE in .env ---'; grep '^APP_RELEASE=' /opt/plane/.env 2>&1 || echo 'not set (defaults to latest)'
            echo '--- local docker images for plane-live ---'; docker images 'ghcr.io/cuoicungtui/plane-live' --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}'
            echo '--- docker inspect plane_live_1 image ref ---'; docker inspect plane_live_1 --format '{{.Config.Image}}' 2>&1 || echo 'FAILED'
            echo '--- docker inspect plane_live_1 image digest ---'; docker inspect plane_live_1 --format '{{.Image}}' 2>&1 | xargs -I{} docker inspect {} --format '{{.RepoDigests}}' 2>&1 || echo 'FAILED'
          "
