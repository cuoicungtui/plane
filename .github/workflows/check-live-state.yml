name: Check Live Logs After Recreate (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/plane_deploy_key
          chmod 600 ~/.ssh/plane_deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Inspect live container status and logs (read-only)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "
            echo '--- plane_live_1 status ---'; docker ps -a --filter name=plane_live_1 --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            echo '--- live logs (tail 150) ---'; docker logs --tail 150 plane_live_1 2>&1
            echo '--- proxy logs grep live/collaboration/upgrade (tail 300) ---'; docker logs --tail 300 plane_proxy_1 2>&1 | grep -i -E 'live|collaboration|upgrade|101|websocket|error' | tail -60
            echo '--- live container networks ---'; docker inspect plane_live_1 --format '{{json .NetworkSettings.Networks}}'
            echo '--- proxy container networks ---'; docker inspect plane_proxy_1 --format '{{json .NetworkSettings.Networks}}'
            echo '--- proxy -> live:3000 reachability ---'; docker exec plane_proxy_1 wget -qO- --timeout=3 http://live:3000/ 2>&1 || echo 'FAILED'
          "
