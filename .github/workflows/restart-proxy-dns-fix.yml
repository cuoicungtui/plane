name: Restart Proxy (fix embedded DNS lookup flakiness)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/plane_deploy_key
          chmod 600 ~/.ssh/plane_deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Restart plane_proxy_1 only (same image/config/ports, fresh network namespace)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          ssh $SSH_OPTS "$SSH_TARGET" '
            set -eu
            echo "--- before restart ---"
            docker ps --filter name=plane_proxy_1 --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            docker restart plane_proxy_1
            echo "--- waiting for proxy to come back healthy ---"
            for attempt in $(seq 1 20); do
              STATUS=$(docker inspect plane_proxy_1 --format "{{.State.Status}}" 2>/dev/null || echo "?")
              if [ "$STATUS" = "running" ]; then
                echo "proxy running after ${attempt} checks"
                break
              fi
              sleep 1
            done
            docker ps --filter name=plane_proxy_1 --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          '

      - name: Verify DNS resolution live -> from inside proxy, and HTTPS still up
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          ssh $SSH_OPTS "$SSH_TARGET" '
            set -eu
            sleep 3
            echo "--- proxy -> live:3000 reachability (repeat x5 to catch flakiness) ---"
            for i in 1 2 3 4 5; do
              docker exec plane_proxy_1 wget -qO- --timeout=3 http://live:3000/ >/dev/null 2>&1 && echo "attempt $i: OK" || echo "attempt $i: FAILED"
            done
            echo "--- HTTPS smoke test ---"
            for attempt in $(seq 1 15); do
              curl -fsS --resolve do.haivan.one:443:127.0.0.1 https://do.haivan.one/ >/dev/null 2>&1 && { echo "HTTPS OK"; break; }
              sleep 2
            done
            echo "--- other containers untouched (api/web/live/db all still running) ---"
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "plane_(api|web|live|db|redis)_1" || true
          '
