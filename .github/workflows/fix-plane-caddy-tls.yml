name: Fix Plane Caddy TLS (add APP_DOMAIN site block)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLANE_SERVER_ROOT: /opt/plane

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/plane_deploy_key
          chmod 600 ~/.ssh/plane_deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload Caddy snippet
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SCP_OPTS="-i ~/.ssh/plane_deploy_key -P ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          scp $SCP_OPTS deployments/production/caddy-snippet-app-domain.conf \
            "$SSH_TARGET:${PLANE_SERVER_ROOT}/caddy-snippet-app-domain.conf.new"

      - name: Append site block, validate, hot-reload Caddy (no container restart, no port/DB changes)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          ssh $SSH_OPTS "$SSH_TARGET" "
            set -eu
            cd '${PLANE_SERVER_ROOT}'

            if grep -q 'APP_DOMAIN' Caddyfile; then
              echo 'Caddyfile already references APP_DOMAIN — nothing to do.'
              rm -f caddy-snippet-app-domain.conf.new
              exit 0
            fi

            BACKUP=\"Caddyfile.bak-\$(date -u +%Y%m%dT%H%M%SZ)\"
            cp Caddyfile \"\$BACKUP\"
            cat caddy-snippet-app-domain.conf.new >> Caddyfile
            rm -f caddy-snippet-app-domain.conf.new

            if docker exec plane_proxy_1 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              docker exec plane_proxy_1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
              echo \"Applied. Backup kept at \$BACKUP\"
            else
              echo 'Validation failed — restoring backup, NOT reloading.' >&2
              cp \"\$BACKUP\" Caddyfile
              exit 1
            fi
          "

      - name: Verify HTTPS now works for the app domain
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          ssh $SSH_OPTS "$SSH_TARGET" "
            set -eu
            for attempt in \$(seq 1 30); do
              curl -fsS --resolve do.haivan.one:443:127.0.0.1 https://do.haivan.one/ >/dev/null 2>&1 && exit 0
              sleep 2
            done
            echo 'HTTPS smoke test failed for do.haivan.one after reload.' >&2
            exit 1
          "
