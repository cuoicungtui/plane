name: Deploy Plane Server

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (built by "Build And Push Plane Images"). Use a commit sha for reproducible rollbacks, or "latest".
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: plane-server-deploy
  cancel-in-progress: false

env:
  PLANE_SERVER_ROOT: /opt/plane

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose manifest
        run: docker compose -f deployments/production/docker-compose.plane.yml config >/dev/null
        env:
          APP_RELEASE: ${{ inputs.image_tag }}
          APP_DOMAIN: placeholder
          WEB_URL: http://placeholder
          CORS_ALLOWED_ORIGINS: http://placeholder
          POSTGRES_PASSWORD: placeholder
          RABBITMQ_PASSWORD: placeholder
          SECRET_KEY: placeholder
          LIVE_SERVER_SECRET_KEY: placeholder
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/plane_deploy_key
          chmod 600 ~/.ssh/plane_deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload updated compose manifest (image tags only)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # scp's port flag is -P (uppercase); -i/-o are shared with ssh.
          SCP_OPTS="-i ~/.ssh/plane_deploy_key -P ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          # Only the compose manifest is touched. The existing .env on the
          # server (ports, domain, DB/redis/mq/minio passwords) is never
          # written to, so infra config and data are untouched.
          scp $SCP_OPTS deployments/production/docker-compose.plane.yml \
            "$SSH_TARGET:${PLANE_SERVER_ROOT}/docker-compose.plane.yml.new"

      - name: Pull new app images, then recreate only changed containers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          ssh $SSH_OPTS "$SSH_TARGET" "
            set -eu
            cd '${PLANE_SERVER_ROOT}'
            export APP_RELEASE='${IMAGE_TAG}'

            if docker compose version >/dev/null 2>&1; then
              COMPOSE='docker compose'
            else
              COMPOSE='docker-compose'
            fi

            # Pull first; if any image is missing/unreachable, abort BEFORE
            # touching the running stack (rule: never break prod on a bad pull).
            \$COMPOSE --env-file .env -f docker-compose.plane.yml.new pull web space admin live api worker beat-worker migrator

            # Swap the manifest in only after a successful pull.
            mv docker-compose.plane.yml.new docker-compose.plane.yml

            # No 'down', no '-v': db/redis/mq/minio/proxy and every named
            # volume (pgdata, redisdata, uploads, rabbitmq_data, ...) are left
            # running untouched. Compose recreates only the containers whose
            # image actually changed (the 5 app services).
            \$COMPOSE --env-file .env -f docker-compose.plane.yml up -d --remove-orphans
          "

      - name: Smoke test
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          ssh $SSH_OPTS "$SSH_TARGET" "
            set -eu
            for attempt in \$(seq 1 30); do curl -fsS 'http://127.0.0.1/' >/dev/null && exit 0; sleep 2; done
            echo 'Smoke test failed — dumping recent logs (containers were NOT rolled back automatically):' >&2
            cd '${PLANE_SERVER_ROOT}'
            if docker compose version >/dev/null 2>&1; then COMPOSE='docker compose'; else COMPOSE='docker-compose'; fi
            \$COMPOSE --env-file .env -f docker-compose.plane.yml ps
            \$COMPOSE --env-file .env -f docker-compose.plane.yml logs --tail=120 proxy api web
            exit 1
          "
