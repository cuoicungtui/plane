name: Verify Server Path (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          test -n "$SERVER_HOST" && test -n "$SERVER_SSH_KEY" && test -n "$SERVER_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/plane_deploy_key
          chmod 600 ~/.ssh/plane_deploy_key
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: List /opt/plane (read-only, no changes made)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SSH_OPTS="-i ~/.ssh/plane_deploy_key -p ${SERVER_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes"
          ssh $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" "
            echo '--- whoami ---'; whoami
            echo '--- ls -la /opt/plane ---'; ls -la /opt/plane 2>&1 || echo 'NOT FOUND'
            echo '--- .env present? ---'; test -f /opt/plane/.env && echo yes || echo no
            echo '--- compose file present? ---'; ls /opt/plane/*.yml /opt/plane/*.yaml 2>&1 || true
            echo '--- currently listening ports (80/443/22) ---'; sudo ss -tlnp 2>/dev/null | grep -E ':80 |:443 |:22 ' || ss -tlnp | grep -E ':80 |:443 |:22 '
            echo '--- docker ps ---'; cd /opt/plane && docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            echo '--- api logs (tail 80) ---'; docker logs --tail 80 plane_api_1 2>&1 || echo 'no plane_api_1'
            echo '--- migrator logs (tail 80) ---'; docker logs --tail 80 plane_migrator_1 2>&1 || echo 'no plane_migrator_1'
            echo '--- proxy logs (tail 40) ---'; docker logs --tail 40 plane_proxy_1 2>&1 || echo 'no plane_proxy_1'
            echo '--- web logs (tail 40) ---'; docker logs --tail 40 plane_web_1 2>&1 || echo 'no plane_web_1'
            echo '--- Caddyfile ---'; cat /opt/plane/Caddyfile 2>&1 || echo 'NOT FOUND'
            echo '--- live logs (tail 120) ---'; docker logs --tail 120 plane_live_1 2>&1 || echo 'no plane_live_1'
            echo '--- proxy logs grep live/collaboration (tail 200) ---'; docker logs --tail 200 plane_proxy_1 2>&1 | grep -i -E 'live|collaboration|upgrade|101|websocket' || echo 'no matches'
          "
